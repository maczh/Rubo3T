[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/mongo",
    "crates/ssh",
    "crates/app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
bson = "2"
base64 = "0.22"
chrono = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "rt"] }
mongodb = ">=3.7.0, <3.9"
egui = "0.29"
eframe = "0.29"
dirs = "5"
fontdb = "0.16"
once_cell = "1"
