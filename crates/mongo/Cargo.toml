[package]
name = "rubo3t-mongo"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rubo3t-core = { path = "../core" }
# MongoDB 3.2.x driver supports MongoDB Server 4.0 (wire version 7) and builds
# on the current Rust toolchain. Driver 3.3+ requires MongoDB Server 4.2.
# rustls-tls avoids a native OpenSSL dependency on Windows.
mongodb = { version = ">=3.2.0, <3.3", features = ["rustls-tls"] }
tokio = { workspace = true }
serde.workspace = true
serde_json.workspace = true
bson.workspace = true
futures-util = "0.3"
